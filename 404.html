<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Random Crap</title>
  <script>
    // GitHub Pages SPA redirect
    // This script takes the current path and redirects to the main app
    // with the path as a parameter so the app can handle routing
    
    const path = window.location.pathname.slice(1) // Remove leading slash
    const search = window.location.search
    
    // Redirect to main app with the path as a parameter
    window.location.replace('/the-random-crap/' + (path ? '?redirect=' + encodeURIComponent(path) : '') + (search || ''))
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
