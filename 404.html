<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Random Crap</title>
  <script>
    // GitHub Pages SPA redirect
    // This script takes the current path and redirects to the main app
    // with the path as a parameter so the app can handle routing
    
    const fullPath = window.location.pathname
    const pathSegments = fullPath.split('/').filter(Boolean)
    
    // Detect if we're on GitHub Pages (has repo name) or custom domain
    let basePath = '/'
    if (pathSegments.length > 0 && window.location.hostname.includes('github.io')) {
      // GitHub Pages: first segment is the repository name
      basePath = '/' + pathSegments[0] + '/'
      // The path to redirect is everything after the repo name
      const redirectPath = pathSegments.slice(1).join('/')
      const search = window.location.search
      
      // Redirect to main app with the path as a parameter
      window.location.replace(basePath + (redirectPath ? '?redirect=' + encodeURIComponent(redirectPath) : '') + (search || ''))
    } else {
      // Custom domain or local - redirect to root
      const redirectPath = pathSegments.join('/')
      const search = window.location.search
      window.location.replace(basePath + (redirectPath ? '?redirect=' + encodeURIComponent(redirectPath) : '') + (search || ''))
    }
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
